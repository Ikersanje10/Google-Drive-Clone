<section class="singupSection">
  <header>
    <h2>Create your account</h2>
    <p>Start organizing your files today</p>
  </header>
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit($event)">
    <label for="fullName">Full name</label>
    <input
      type="text"
      name="fullName"
      id="fullName"
      placeholder="Jane Cooper"
      formControlName="fullName"
    />

    <label for="email">Email</label>
    <input
      type="email"
      name="email"
      id="email"
      placeholder="you@example.com"
      formControlName="email"
    />
    @if (signupForm.get('email')?.hasError('emailTaken')) {
      <span class="field-error">This email is already registered</span>
    }
    <label for="password">Password</label>
    <input
      type="password"
      name="password"
      id="password"
      placeholder="••••••"
      formControlName="password"
    />

    <label for="confirmPassword">Confirm password</label>
    <input
      type="password"
      name="confirmPassword"
      id="confirmPassword"
      placeholder="••••••"
      formControlName="confirmPassword"
    />
    @if (signupForm.get('confirmPassword')?.errors?.['passwordMismatch']) {
      <span class="field-error">Passowrd must be equal</span>
    }
    <button type="submit" id="signupButton">Create account</button>
    <div class="divider"><span>or</span></div>
    <button id="googleAuthenticationButton">
      <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path
          fill="#FFC107"
          d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"
        />
        <path
          fill="#FF3D00"
          d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"
        />
        <path
          fill="#4CAF50"
          d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6c-2 1.5-4.6 2.5-7.7 2.5-5.3 0-9.7-3.4-11.3-8H5.9v6.2C9.1 39.6 16 44 24 44z"
        />
        <path
          fill="#1976D2"
          d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.4 36 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"
        />
      </svg>
      <span> Continue with Google </span>
    </button>
  </form>
  <footer>
    <p>Already have an account? <a routerLink="/signin" id="showSigninPageButton">Sign in</a></p>
  </footer>
</section>
<app-signup-success-modal
  [visible]="showSuccessModal()"
  (goToLogin)="goToLogin()"
  (createAnotherAccount)="hideSuccessModal()"
></app-signup-success-modal>

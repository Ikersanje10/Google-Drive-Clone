spring.config.import=optional:file:../.env[.properties]

spring.application.name=google-drive-demo

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${EMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.data.redis.host=localhost
spring.data.redis.port=6379


rate-limiting.default-limit=60
rate-limiting.default-duration-seconds=60

rate-limiting.rules[0].path=/api/v1/login
rate-limiting.rules[0].limit=3
rate-limiting.rules[0].duration-seconds=300

rate-limiting.rules[1].path=/api/v1/signup
rate-limiting.rules[1].limit=3
rate-limiting.rules[1].duration-seconds=60

rate-limiting.rules[2].path=/api/v1/login/resendOtp
rate-limiting.rules[2].limit=1
rate-limiting.rules[2].duration-seconds=60

rate-limiting.rules[3].path=/api/v1/login/otp
rate-limiting.rules[3].limit=3
rate-limiting.rules[3].duration-seconds=60

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


minio.url=http://localhost:9000
minio.access.name=${MINIO_ROOT_USER}
minio.access.secret=${MINIO_ROOT_PASSWORD}
minio.bucket.name=google-drive-bucket